<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <radialGradient id="craftBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#EFE9DE"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCDCDC"/>
      <stop offset="50%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#A9A9A9"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <filter id="craftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#123A70" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="url(#craftBg)"/>

  <!-- Decorative Blueprint / Gemological Grid -->
  <g stroke="#C5A059" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="4,4">
    <circle cx="400" cy="320" r="220"/>
    <circle cx="400" cy="320" r="160"/>
    <line x1="150" y1="320" x2="650" y2="320"/>
    <line x1="400" y1="80" x2="400" y2="560"/>
  </g>

  <!-- Gemological Diamond Loupe -->
  <g filter="url(#craftShadow)" transform="translate(240, 190) rotate(-25)">
    <!-- Loupe Body -->
    <rect x="-30" y="-80" width="60" height="160" rx="30" fill="url(#metalGrad)" stroke="#888888" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#123A70" opacity="0.1"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldAcc)" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" opacity="0.4"/>
    <!-- Glass Highlight -->
    <path d="M -25,-25 A 35 35 0 0 1 25,-25" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Precision Gem Tweezers holding Ceylon Sapphire -->
  <g filter="url(#craftShadow)" transform="translate(430, 290)">
    <!-- Left Arm -->
    <path d="M 180,-200 L -40,-20 L -60,0 L 160,-230 Z" fill="url(#metalGrad)" stroke="#777777" stroke-width="1"/>
    <!-- Right Arm -->
    <path d="M 230,-160 L -10,20 L -30,40 L 250,-130 Z" fill="url(#metalGrad)" stroke="#777777" stroke-width="1"/>
    <!-- Tweezer grip ridges -->
    <line x1="120" y1="-140" x2="140" y2="-120" stroke="#888888" stroke-width="2"/>
    <line x1="130" y1="-150" x2="150" y2="-130" stroke="#888888" stroke-width="2"/>
    <line x1="140" y1="-160" x2="160" y2="-140" stroke="#888888" stroke-width="2"/>
  </g>

  <!-- Centerpiece Blue Sapphire -->
  <g filter="url(#craftShadow)" transform="translate(380, 310)">
    <polygon points="-55,-35 0,-60 55,-35 70,15 35,60 -35,60 -70,15" fill="#123A70"/>
    <polygon points="-40,-25 0,-45 40,-25 50,10 25,45 -25,45 -50,10" fill="#1A4E94"/>
    <polygon points="-25,-15 0,-30 25,-15 30,5 15,30 -15,30 -30,5" fill="#4F8EEB"/>
    <polygon points="0,-30 25,-15 0,0 -25,-15" fill="#8BB8FF" opacity="0.85"/>
    <polygon points="0,0 25,-15 30,5 15,30 0,0" fill="#2E72D6"/>
    <!-- Sparkle -->
    <g transform="translate(35, -25)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Badge in corner -->
  <g transform="translate(40, 530)">
    <rect width="260" height="70" rx="8" fill="#123A70"/>
    <rect x="2" y="2" width="256" height="66" rx="6" fill="none" stroke="url(#goldAcc)" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Cinzel', serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#C5A059">SRI LANKAN HERITAGE</text>
    <text x="24" y="52" font-family="'Montserrat', sans-serif" font-size="10" fill="#EAEFF7">Direct from the Island of Gems</text>
  </g>
</svg>