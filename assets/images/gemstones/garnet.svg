<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF5F5"/>
      <stop offset="100%" stop-color="#EFE2E2"/>
    </radialGradient>
    <linearGradient id="garDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0A0C"/>
      <stop offset="100%" stop-color="#611316"/>
    </linearGradient>
    <linearGradient id="garMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1F24"/>
      <stop offset="100%" stop-color="#B32B32"/>
    </linearGradient>
    <linearGradient id="garLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE4E55"/>
      <stop offset="100%" stop-color="#FFA1A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#3D0A0C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#3D0A0C" opacity="0.14"/>

  <!-- Round / Cushion Rhodolite Sri Lankan Garnet -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <circle cx="0" cy="0" r="185" fill="url(#garDark)"/>
    <polygon points="0,-175 110,-115 140,0 110,115 0,175 -110,115 -140,0 -110,-115" fill="url(#garMid)"/>
    <polygon points="0,-175 70,-155 110,-115" fill="url(#garLight)" opacity="0.85"/>
    
    <circle cx="0" cy="0" r="110" fill="url(#garLight)" opacity="0.95"/>
    <polygon points="0,-85 65,-30 0,0" fill="#FFEBEB" opacity="0.9"/>
    <polygon points="0,-85 -65,-30 0,0" fill="#E65E64" opacity="0.85"/>
    <polygon points="65,-30 65,50 0,0" fill="#B32B32" opacity="0.9"/>
    <polygon points="-65,-30 -65,50 0,0" fill="#7A1519" opacity="0.9"/>
    <polygon points="0,0 65,50 0,85" fill="#D94149" opacity="0.9"/>
    <polygon points="0,0 -65,50 0,85" fill="#991C21" opacity="0.9"/>

    <g transform="translate(45, -55)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-45, 45) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>