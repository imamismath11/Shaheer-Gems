<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCF5F8"/>
      <stop offset="100%" stop-color="#F7E6EF"/>
    </radialGradient>
    <linearGradient id="pinkDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80144E"/>
      <stop offset="100%" stop-color="#B31D6D"/>
    </linearGradient>
    <linearGradient id="pinkMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92E8B"/>
      <stop offset="100%" stop-color="#F04FA8"/>
    </linearGradient>
    <linearGradient id="pinkLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85C8"/>
      <stop offset="100%" stop-color="#FFCCE6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#80144E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#80144E" opacity="0.12"/>

  <!-- Ceylon Hot Pink Sapphire (Oval Mixed Cut) -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <ellipse cx="0" cy="0" rx="180" ry="200" fill="url(#pinkDark)"/>
    <polygon points="0,-180 110,-120 140,0 110,120 0,180 -110,120 -140,0 -110,-120" fill="url(#pinkMid)"/>
    <polygon points="0,-180 70,-160 110,-120" fill="url(#pinkLight)" opacity="0.85"/>
    
    <ellipse cx="0" cy="0" rx="110" ry="125" fill="url(#pinkLight)" opacity="0.95"/>
    <polygon points="0,-95 70,-35 0,0" fill="#FFF0F7" opacity="0.9"/>
    <polygon points="0,-95 -70,-35 0,0" fill="#FFA3D5" opacity="0.85"/>
    <polygon points="70,-35 70,55 0,0" fill="#E62287" opacity="0.9"/>
    <polygon points="-70,-35 -70,55 0,0" fill="#99125B" opacity="0.9"/>
    <polygon points="0,0 70,55 0,95" fill="#FF5CB4" opacity="0.9"/>
    <polygon points="0,0 -70,55 0,95" fill="#BF1571" opacity="0.9"/>

    <g transform="translate(45, -60)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-50, 45) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>