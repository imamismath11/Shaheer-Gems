<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF4F5"/>
      <stop offset="100%" stop-color="#F2E4E6"/>
    </radialGradient>
    <linearGradient id="rubyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E0011"/>
      <stop offset="100%" stop-color="#8F0E23"/>
    </linearGradient>
    <linearGradient id="rubyMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B81430"/>
      <stop offset="100%" stop-color="#D92341"/>
    </linearGradient>
    <linearGradient id="rubyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF526F"/>
      <stop offset="100%" stop-color="#FFA8B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#5E0011" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#5E0011" opacity="0.14"/>

  <!-- Cushion Pigeon Blood Ruby -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <path d="M -160,-120 C -160,-180 -120,-200 0,-200 C 120,-200 160,-180 160,-120 C 160,-30 170,70 140,140 C 100,190 50,205 0,205 C -50,205 -100,190 -140,140 C -170,70 -160,-30 -160,-120 Z" fill="url(#rubyDark)"/>
    <polygon points="0,-160 110,-90 90,90 0,160 -90,90 -110,-90" fill="url(#rubyMid)"/>
    <polygon points="0,-160 80,-140 110,-90" fill="url(#rubyLight)" opacity="0.85"/>
    <polygon points="0,-160 -80,-140 -110,-90" fill="url(#rubyMid)" opacity="0.9"/>
    
    <polygon points="0,-90 70,-45 55,55 0,95 -55,55 -70,-45" fill="url(#rubyLight)" opacity="0.95"/>
    <polygon points="0,-90 55,-35 0,0" fill="#FFE0E5" opacity="0.85"/>
    <polygon points="0,-90 -55,-35 0,0" fill="#FF8CA0" opacity="0.8"/>
    <polygon points="55,-35 55,55 0,0" fill="#E62948" opacity="0.85"/>
    <polygon points="-55,-35 -55,55 0,0" fill="#A8132B" opacity="0.85"/>
    <polygon points="0,0 55,55 0,95" fill="#FA4663" opacity="0.9"/>
    <polygon points="0,0 -55,55 0,95" fill="#8C0D21" opacity="0.9"/>

    <g transform="translate(45, -70)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-55, 45) scale(0.6)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>