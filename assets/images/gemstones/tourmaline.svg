<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2FAF9"/>
      <stop offset="100%" stop-color="#DDF2F0"/>
    </radialGradient>
    <linearGradient id="tourDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043838"/>
      <stop offset="100%" stop-color="#085757"/>
    </linearGradient>
    <linearGradient id="tourMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7878"/>
      <stop offset="100%" stop-color="#149E9E"/>
    </linearGradient>
    <linearGradient id="tourLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C7C7"/>
      <stop offset="100%" stop-color="#8CE8E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#043838" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#043838" opacity="0.14"/>

  <!-- Emerald / Baguette Cut Ceylon Teal Tourmaline -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <polygon points="-110,-190 110,-190 165,-130 165,130 110,190 -110,190 -165,130 -165,-130" fill="url(#tourDark)"/>
    
    <polygon points="-90,-165 90,-165 140,-115 140,115 90,165 -90,165 -140,115 -140,-115" fill="url(#tourMid)"/>
    <polygon points="-110,-190 110,-190 90,-165 -90,-165" fill="url(#tourLight)" opacity="0.85"/>
    <polygon points="165,-130 165,130 140,115 140,-115" fill="url(#tourDark)" opacity="0.9"/>
    
    <polygon points="-70,-125 70,-125 110,-85 110,85 70,125 -70,125 -110,85 -110,-85" fill="url(#tourLight)" opacity="0.95"/>
    <polygon points="-50,-90 50,-90 75,-60 75,60 50,90 -50,90 -75,60 -75,-60" fill="#E0FCFC" opacity="0.45"/>
    <polygon points="-30,-50 30,-50 45,-30 45,30 30,50 -30,50 -45,30 -45,-30" fill="#FFFFFF" opacity="0.6"/>

    <g transform="translate(70, -90)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-75, 60) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>