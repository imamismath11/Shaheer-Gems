<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F9FB"/>
      <stop offset="100%" stop-color="#E8ECEF"/>
    </radialGradient>
    <linearGradient id="wDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B8794"/>
      <stop offset="100%" stop-color="#9AA5B1"/>
    </linearGradient>
    <linearGradient id="wMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD2D9"/>
      <stop offset="100%" stop-color="#E4E7EB"/>
    </linearGradient>
    <linearGradient id="wLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#52606D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#52606D" opacity="0.1"/>

  <!-- Round Brilliant Cut Ceylon White Sapphire -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <circle cx="0" cy="0" r="190" fill="url(#wDark)"/>
    
    <!-- Outer Star & Kite Facets -->
    <polygon points="0,-190 73,-175 134,-134 175,-73 190,0 175,73 134,134 73,175 0,190 -73,175 -134,134 -175,73 -190,0 -175,-73 -134,-134 -73,-175" fill="url(#wMid)"/>
    
    <!-- Triangular Crown Facets -->
    <polygon points="0,-190 55,-130 0,-115 -55,-130" fill="url(#wLight)" opacity="0.95"/>
    <polygon points="134,-134 130,-55 115,0 130,55" fill="#D3DCE6" opacity="0.8"/>
    <polygon points="0,190 55,130 0,115 -55,130" fill="#BCC5D1" opacity="0.9"/>
    <polygon points="-134,-134 -130,-55 -115,0 -130,55" fill="#E8EDF2" opacity="0.85"/>
    
    <!-- Octagonal Table -->
    <polygon points="-50,-115 50,-115 115,-50 115,50 50,115 -50,115 -115,50 -115,-50" fill="url(#wLight)"/>
    
    <!-- Internal Diamond Luster / Prismatic Highlights -->
    <polygon points="-50,-115 0,0 50,-115" fill="#EDF2F7" opacity="0.9"/>
    <polygon points="115,-50 0,0 115,50" fill="#E2E8F0" opacity="0.8"/>
    <polygon points="50,115 0,0 -50,115" fill="#CBD5E0" opacity="0.9"/>
    <polygon points="-115,50 0,0 -115,-50" fill="#F7FAFC" opacity="0.95"/>
    
    <!-- Spectrum flashes (Blue & Gold hints) -->
    <polygon points="0,0 50,-50 70,-20" fill="#BEE3F8" opacity="0.5"/>
    <polygon points="0,0 -50,50 -70,20" fill="#FEFCBF" opacity="0.5"/>

    <!-- Brilliant Sparkle Stars -->
    <g transform="translate(60, -70)">
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-65, 55) scale(0.7)">
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>