<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C7730"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4D8F"/>
      <stop offset="100%" stop-color="#0F2B52"/>
    </linearGradient>
  </defs>

  <!-- Gemstone Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer faceted gem ring / crown -->
    <polygon points="32,2 48,2 58,16 48,30 16,30 6,16 16,2" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Facets -->
    <polygon points="32,2 48,2 40,16 24,16" fill="url(#goldGrad)" opacity="0.35"/>
    <polygon points="16,2 32,2 24,16 6,16" fill="url(#goldGrad)" opacity="0.2"/>
    <polygon points="48,2 58,16 40,16" fill="url(#goldGrad)" opacity="0.45"/>
    <!-- Lower pavilion -->
    <polygon points="6,16 24,16 32,54" fill="url(#blueGrad)" opacity="0.85"/>
    <polygon points="24,16 40,16 32,54" fill="url(#goldGrad)" opacity="0.95"/>
    <polygon points="40,16 58,16 32,54" fill="url(#blueGrad)" opacity="0.85"/>
    <polygon points="6,16 16,30 32,54" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="58,16 48,30 32,54" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Sparkle star -->
    <circle cx="54" cy="8" r="2" fill="#FFFFFF"/>
    <line x1="54" y1="4" x2="54" y2="12" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="50" y1="8" x2="58" y2="8" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="#123A70">SHAHEER</text>
  <text x="248" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">GEMS</text>
  <line x1="82" y1="46" x2="385" y2="46" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
  <text x="83" y="60" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="9" font-weight="500" letter-spacing="4.5" fill="#666666">NATURAL PRECIOUS GEMSTONES • CEYLON</text>
</svg>