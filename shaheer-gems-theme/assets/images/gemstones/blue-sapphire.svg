<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F9FC"/>
      <stop offset="100%" stop-color="#EAEFF7"/>
    </radialGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2246"/>
      <stop offset="100%" stop-color="#123A70"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4E94"/>
      <stop offset="100%" stop-color="#2869C0"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8EEB"/>
      <stop offset="100%" stop-color="#8BB8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#123A70" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Soft reflection -->
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#123A70" opacity="0.12"/>

  <!-- Cushion Cut Ceylon Blue Sapphire -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <!-- Outer Contour -->
    <path d="M -160,-110 C -160,-170 -110,-200 0,-200 C 110,-200 160,-170 160,-110 C 160, -30 180,70 140,140 C 100,190 50,210 0,210 C -50,210 -100,190 -140,140 C -180,70 -160,-30 -160,-110 Z" fill="url(#facetDark)"/>

    <!-- Pavilion Facet Structure -->
    <polygon points="0,-160 110,-90 90,90 0,160 -90,90 -110,-90" fill="url(#facetMid)"/>
    <polygon points="0,-160 80,-140 110,-90" fill="url(#facetLight)" opacity="0.85"/>
    <polygon points="0,-160 -80,-140 -110,-90" fill="url(#facetMid)" opacity="0.9"/>
    <polygon points="110,-90 140,-20 120,60 90,90" fill="url(#facetDark)"/>
    <polygon points="-110,-90 -140,-20 -120,60 -90,90" fill="url(#facetDark)"/>
    
    <!-- Table & Star Facets -->
    <polygon points="0,-90 70,-45 55,55 0,95 -55,55 -70,-45" fill="url(#facetLight)" opacity="0.95"/>
    <polygon points="0,-90 55,-35 0,0" fill="#B8D7FF" opacity="0.8"/>
    <polygon points="0,-90 -55,-35 0,0" fill="#6EA8FF" opacity="0.8"/>
    <polygon points="55,-35 55,55 0,0" fill="#2E72D6" opacity="0.85"/>
    <polygon points="-55,-35 -55,55 0,0" fill="#1C53A6" opacity="0.85"/>
    <polygon points="0,0 55,55 0,95" fill="#4B8BF5" opacity="0.9"/>
    <polygon points="0,0 -55,55 0,95" fill="#1D4E96" opacity="0.9"/>

    <!-- Brilliant Sparkle Stars -->
    <g transform="translate(45, -70)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-60, 40) scale(0.6)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>