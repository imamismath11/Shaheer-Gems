<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4FAF6"/>
      <stop offset="100%" stop-color="#E2F2E7"/>
    </radialGradient>
    <linearGradient id="emDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054522"/>
      <stop offset="100%" stop-color="#0A6935"/>
    </linearGradient>
    <linearGradient id="emMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#108A48"/>
      <stop offset="100%" stop-color="#1CB361"/>
    </linearGradient>
    <linearGradient id="emLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54D98E"/>
      <stop offset="100%" stop-color="#A6F7C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#054522" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#054522" opacity="0.14"/>

  <!-- Octagonal Emerald Cut Emerald -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <!-- Outer Contour (Step Cut Octagon) -->
    <polygon points="-110,-190 110,-190 165,-130 165,130 110,190 -110,190 -165,130 -165,-130" fill="url(#emDark)"/>
    
    <!-- Step Facets Level 1 -->
    <polygon points="-90,-165 90,-165 140,-115 140,115 90,165 -90,165 -140,115 -140,-115" fill="url(#emMid)"/>
    <polygon points="-110,-190 110,-190 90,-165 -90,-165" fill="url(#emLight)" opacity="0.85"/>
    <polygon points="165,-130 165,130 140,115 140,-115" fill="url(#emDark)" opacity="0.9"/>
    
    <!-- Table -->
    <polygon points="-70,-125 70,-125 110,-85 110,85 70,125 -70,125 -110,85 -110,-85" fill="url(#emLight)" opacity="0.95"/>
    
    <!-- Internal Step Reflections -->
    <polygon points="-50,-90 50,-90 75,-60 75,60 50,90 -50,90 -75,60 -75,-60" fill="#E8FFF1" opacity="0.45"/>
    <polygon points="-30,-50 30,-50 45,-30 45,30 30,50 -30,50 -45,30 -45,-30" fill="#FFFFFF" opacity="0.6"/>

    <!-- Sparkle Stars -->
    <g transform="translate(70, -90)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-75, 60) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>