<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5EFE0"/>
    </radialGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67808"/>
      <stop offset="100%" stop-color="#CF9611"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBB31A"/>
      <stop offset="100%" stop-color="#F7CA3B"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="100%" stop-color="#FFF5C2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#A67808" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#A67808" opacity="0.12"/>

  <!-- Oval Cut Golden Yellow Ceylon Sapphire -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <!-- Outer Contour -->
    <ellipse cx="0" cy="0" rx="180" ry="210" fill="url(#facetDark)"/>
    
    <!-- Outer Facets -->
    <polygon points="0,-185 110,-125 145,0 110,125 0,185 -110,125 -145,0 -110,-125" fill="url(#facetMid)"/>
    <polygon points="0,-185 70,-165 110,-125" fill="url(#facetLight)" opacity="0.85"/>
    <polygon points="0,-185 -70,-165 -110,-125" fill="url(#facetMid)" opacity="0.9"/>
    
    <!-- Table & Star Facets -->
    <ellipse cx="0" cy="0" rx="110" ry="135" fill="url(#facetLight)" opacity="0.95"/>
    <polygon points="0,-105 75,-40 0,0" fill="#FFFBE6" opacity="0.9"/>
    <polygon points="0,-105 -75,-40 0,0" fill="#FCE16A" opacity="0.85"/>
    <polygon points="75,-40 75,60 0,0" fill="#F0B918" opacity="0.9"/>
    <polygon points="-75,-40 -75,60 0,0" fill="#D69A09" opacity="0.9"/>
    <polygon points="0,0 75,60 0,105" fill="#FFE27A" opacity="0.9"/>
    <polygon points="0,0 -75,60 0,105" fill="#E6A80D" opacity="0.9"/>

    <!-- Sparkle Stars -->
    <g transform="translate(-40, -65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(55, 45) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>