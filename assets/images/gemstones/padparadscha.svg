<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCF6F4"/>
      <stop offset="100%" stop-color="#F7ECE8"/>
    </radialGradient>
    <linearGradient id="padDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83A4B"/>
      <stop offset="50%" stop-color="#D95338"/>
      <stop offset="100%" stop-color="#C2422D"/>
    </linearGradient>
    <linearGradient id="padMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D75"/>
      <stop offset="50%" stop-color="#F57E5B"/>
      <stop offset="100%" stop-color="#F28E46"/>
    </linearGradient>
    <linearGradient id="padLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="50%" stop-color="#FFBD9E"/>
      <stop offset="100%" stop-color="#FFE4D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#B83A4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="24" fill="#B83A4B" opacity="0.12"/>

  <!-- Ceylon Padparadscha Sapphire (Lotus Sunset Pink-Orange) -->
  <g filter="url(#shadow)" transform="translate(300, 290)">
    <ellipse cx="0" cy="0" rx="175" ry="200" fill="url(#padDark)"/>
    <polygon points="0,-175 110,-115 140,0 110,115 0,175 -110,115 -140,0 -110,-115" fill="url(#padMid)"/>
    <polygon points="0,-175 70,-155 110,-115" fill="url(#padLight)" opacity="0.85"/>
    <polygon points="0,-175 -70,-155 -110,-115" fill="url(#padMid)" opacity="0.9"/>
    
    <!-- Table & Star Facets -->
    <ellipse cx="0" cy="0" rx="105" ry="125" fill="url(#padLight)" opacity="0.95"/>
    <polygon points="0,-95 70,-35 0,0" fill="#FFF0E6" opacity="0.9"/>
    <polygon points="0,-95 -70,-35 0,0" fill="#FFB094" opacity="0.85"/>
    <polygon points="70,-35 70,55 0,0" fill="#F06A58" opacity="0.9"/>
    <polygon points="-70,-35 -70,55 0,0" fill="#DB4D6D" opacity="0.9"/>
    <polygon points="0,0 70,55 0,95" fill="#FF9A76" opacity="0.9"/>
    <polygon points="0,0 -70,55 0,95" fill="#E8536A" opacity="0.9"/>

    <!-- Sparkle Stars -->
    <g transform="translate(40, -60)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-50, 45) scale(0.65)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>